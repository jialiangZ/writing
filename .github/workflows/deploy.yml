name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as every other Pages workflow on this account so parallel
# deploys never clash.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Build with Astro + Pagefind
        run: |
          npm ci
          npm run build
      - name: Sanity checks
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/posts/index.html
          test -f dist/rss.xml
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          test -d dist/pagefind
          grep -q 'https://jialiangz.github.io/writing/' dist/sitemap-0.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4